<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marker Pen Bookmarklet</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 48px auto;
      padding: 0 24px;
      line-height: 1.5;
      color: #111827;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    #bm {
      display: inline-block;
      padding: 10px 16px;
      background: #ef4444;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin: 12px 0;
    }
    #bm:hover { background: #dc2626; }
    textarea {
      width: 100%;
      min-height: 120px;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1>Marker Pen Bookmarklet</h1>
  <p>Drag the red link below to your Chrome bookmarks bar, then click it on any page to draw or underline.</p>
  <p><a id="bm" href="#" draggable="true">✎ Marker Pen</a></p>
  <p>Or copy this URL and create a new bookmark manually:</p>
  <textarea id="code" readonly></textarea>

  <script type="text/plain" id="bmsrc">
(()=>{
  if(window.__mpMarker)return;
  window.__mpMarker=1;
  const css=document.createElement('style');
  css.textContent=`
    body{position:relative}
    .mpm-btn{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:2147483647;display:flex;align-items:center;justify-content:center}
    .mpm-btn:hover{background:#dc2626}
    .mpm-panel{position:fixed;bottom:78px;right:20px;width:260px;background:#fff;border:1px solid #c8dcfb;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:2147483647;display:none;flex-direction:column;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .mpm-panel.open{display:flex}
    .mpm-header{padding:8px 12px;background:#f6f8fa;border-bottom:1px solid #c8dcfb;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
    .mpm-header button{background:none;border:none;cursor:pointer;font-size:14px;color:#666}
    .mpm-header button:hover{color:#111827}
    .mpm-tools{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #c8dcfb;font-size:13px;flex-wrap:wrap}
    .mpm-mode{flex:0 0 auto;background:#f3f4f6;border:1px solid #ddd;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
    .mpm-mode.active{background:#2f7df6;color:#fff;border-color:#2f7df6}
    .mpm-size{display:flex;align-items:center;gap:6px;color:#4b6386;font-size:13px}
    .mpm-size input{width:90px}
    .mpm-dots{display:flex;align-items:center;gap:6px}
    .mpm-dot{width:24px;height:24px;border-radius:999px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(15,39,74,.28);cursor:pointer}
    .mpm-dot.active{box-shadow:0 0 0 2px #fff,0 0 0 3px #0f274a}
    .mpm-color{width:24px;height:24px;border:0;padding:0;border-radius:50%;overflow:hidden;cursor:pointer;background:conic-gradient(#ef4444,#facc15,#16a34a,#2563eb,#a855f7,#ef4444)}
    .mpm-color::-webkit-color-swatch-wrapper{padding:0}
    .mpm-color::-webkit-color-swatch{border:0;border-radius:50%}
    .mpm-erase,.mpm-eraser{width:28px;height:28px;border-radius:50%;background:#f6faff;border:1px solid #c8dcfb;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
    .mpm-erase.active,.mpm-eraser.active{background:#0f274a;color:#fff;border-color:#0f274a}
    .mpm-action{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
    .mpm-clear{background:#fff1f4;color:#c93d4f;border:none}
    .mpm-overlay{position:fixed;top:0;left:0;z-index:2147483646;pointer-events:none;display:none;width:100vw;height:100vh}
    .mpm-overlay.active{display:block}
    .mpm-overlay canvas{width:100%;height:100%;display:block}
  `;
  document.head.appendChild(css);
  const root=document.createElement('div');
  root.innerHTML=`<button class="mpm-btn" title="Marker Pen">✎</button>
    <div class="mpm-panel">
      <div class="mpm-header"><span>Marker Pen</span><button data-act="close" title="Close">✕</button></div>
      <div class="mpm-tools">
        <button class="mpm-mode active" data-mode="underline">Underline</button>
        <button class="mpm-mode" data-mode="text">Text</button>
        <button class="mpm-mode" data-mode="laser">Laser</button>
        <label class="mpm-size">Size<input type="range" min="1" max="18" value="4"></label>
        <div class="mpm-dots">
          <span class="mpm-dot active" data-color="#ef4444" style="background:#ef4444" title="Red"></span>
          <span class="mpm-dot" data-color="#16a34a" style="background:#16a34a" title="Green"></span>
          <span class="mpm-dot" data-color="#facc15" style="background:#facc15" title="Yellow"></span>
        </div>
        <input class="mpm-color" type="color" value="#ef4444" title="Choose a custom RGB color">
        <button class="mpm-eraser" data-mode="erase" title="Eraser">⌫</button>
        <button class="mpm-action mpm-clear" data-act="clear">Clear marks</button>
      </div>
    </div>
    <div class="mpm-overlay"><canvas></canvas></div>`;
  document.body.appendChild(root);
  const btn=root.querySelector('.mpm-btn');
  const panel=root.querySelector('.mpm-panel');
  const overlay=root.querySelector('.mpm-overlay');
  const canvas=root.querySelector('canvas');
  const ctx=canvas.getContext('2d');
  const sizeInput=root.querySelector('.mpm-size input');
  const modeBtns=Array.from(root.querySelectorAll('.mpm-mode'));
  const dotBtns=Array.from(root.querySelectorAll('.mpm-dot'));
  const colorInput=root.querySelector('.mpm-color');
  const eraserBtn=root.querySelector('.mpm-eraser');
  let active=false,drawing=false,color='#ef4444',mode='underline',size=4,strokes=[],current=null,laser=null,laserFade=null;
  const key=()=>`mpm:${location.host}${location.pathname}${location.search}`;
  const save=()=>{localStorage.setItem(key(),JSON.stringify(strokes));};
  const load=()=>{try{strokes=JSON.parse(localStorage.getItem(key())||'[]');}catch{strokes=[];}drawAll();};
  const resize=()=>{canvas.width=innerWidth;canvas.height=innerHeight;overlay.style.width=innerWidth+'px';overlay.style.height=innerHeight+'px';drawAll();};
  const pt=(e)=>({x:e.clientX,y:e.clientY});
  const isInteractive=(t)=>t.closest('.mpm-panel,.mpm-btn,.mpm-dot,.mpm-eraser,a,button,input,select,textarea');
  const getNodePath=(node)=>{const path=[];let cur=node;while(cur&&cur!==document.body){const p=cur.parentNode;if(!p)return null;const i=Array.from(p.childNodes).indexOf(cur);if(i===-1)return null;path.unshift(i);cur=p;}return cur===document.body?path:null;};
  const getNodeFromPath=(path)=>path.reduce((node,i)=>node?.childNodes[i],document.body);
  const drawAll=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.lineCap='round';ctx.lineJoin='round';
    for(const s of strokes){
      if(s.type==='text'){ctx.globalCompositeOperation='source-over';ctx.fillStyle=s.color;ctx.font=`${Math.max(s.size*4,14)}px Segoe UI, sans-serif`;ctx.fillText(s.text,s.x,s.y);continue;}
      if(s.type==='anchor'){try{const a=getNodeFromPath(s.startPath),b=getNodeFromPath(s.endPath);if(!a||!b)continue;const r=document.createRange();r.setStart(a,s.startOffset);r.setEnd(b,s.endOffset);const rects=Array.from(r.getClientRects());ctx.globalCompositeOperation='source-over';ctx.strokeStyle=s.color;ctx.lineWidth=s.size;for(const rc of rects){const y=rc.bottom+2;ctx.beginPath();ctx.moveTo(rc.left,y);ctx.lineTo(rc.right,y);ctx.stroke();}}catch{}continue;}
      if(!s.points||s.points.length<2)continue;
      ctx.globalCompositeOperation=s.type==='erase'?'destination-out':'source-over';
      ctx.strokeStyle=s.color;ctx.lineWidth=s.size;
      ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
      for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);
      ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
  };
  const drawCurrent=()=>{
    if(!current||!current.points||current.points.length<2)return;
    ctx.save();
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.globalCompositeOperation=current.type==='erase'?'destination-out':'source-over';
    ctx.strokeStyle=current.color;ctx.lineWidth=current.size;
    if(current.type==='laser'){ctx.shadowColor=current.color;ctx.shadowBlur=12;}
    ctx.beginPath();ctx.moveTo(current.points[0].x,current.points[0].y);
    for(let i=1;i<current.points.length;i++)ctx.lineTo(current.points[i].x,current.points[i].y);
    ctx.stroke();ctx.restore();
  };
  const setMode=(next)=>{mode=next;modeBtns.forEach(b=>b.classList.toggle('active',b.dataset.mode===next));eraserBtn.classList.toggle('active',next==='erase');};
  const setColor=(next)=>{color=next;dotBtns.forEach(d=>d.classList.toggle('active',d.dataset.color===next));colorInput.value=next;};
  const setActive=(next)=>{active=next;panel.classList.toggle('open',active);overlay.classList.toggle('active',active);document.body.style.cursor=active?'crosshair':'';};
  const start=(e)=>{if(!active||e.button!==0||isInteractive(e.target))return;const p=pt(e);if(mode==='text'){const text=window.prompt('Add note:');if(text&&text.trim()){strokes.push({type:'text',color,size,x:p.x,y:p.y,text:text.trim()});save();drawAll();}return;}const hasText=e.target!==document.body&&e.target!==document.documentElement&&(e.target.textContent||'').trim().length>0;if(mode==='underline'&&hasText)return;e.preventDefault();drawing=true;current={type:mode,color,size,points:[p]};};
  const move=(e)=>{if(!drawing||!current)return;if(isInteractive(e.target))return;e.preventDefault();const p=pt(e);if(mode==='underline'){current.points[1]={x:p.x,y:current.points[0].y};}else{current.points.push(p);}drawAll();drawCurrent();};
  const fadeLaser=()=>{if(laserFade)cancelAnimationFrame(laserFade);laser=current;const start=performance.now();const step=(now)=>{const o=Math.max(0,1-(now-start)/900);drawAll();if(laser&&laser.points){ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=o;ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor=color;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(laser.points[0].x,laser.points[0].y);for(let i=1;i<laser.points.length;i++)ctx.lineTo(laser.points[i].x,laser.points[i].y);ctx.stroke();ctx.restore();}if(o>0){laserFade=requestAnimationFrame(step);}else{laser=null;laserFade=null;}};laserFade=requestAnimationFrame(step);};
  const end=()=>{if(drawing&&current){drawing=false;if(mode==='laser'){fadeLaser();current=null;return;}if(current.points.length>1){strokes.push(current);save();}current=null;drawAll();}if(mode==='underline')addAnchor();};
  const addAnchor=()=>{if(!active||mode!=='underline')return;const sel=window.getSelection();if(!sel||sel.isCollapsed){sel?.removeAllRanges();return;}const r=sel.getRangeAt(0);const sp=getNodePath(r.startContainer),ep=getNodePath(r.endContainer);if(!sp||!ep){sel.removeAllRanges();return;}strokes.push({type:'anchor',color,size,startPath:sp,startOffset:r.startOffset,endPath:ep,endOffset:r.endOffset});save();drawAll();sel.removeAllRanges();};
  const clear=()=>{if(confirm('Clear all marks?')){strokes=[];save();drawAll();}};
  btn.onclick=()=>setActive(!active);
  root.querySelector('[data-act="close"]').onclick=()=>setActive(false);
  root.querySelector('[data-act="clear"]').onclick=clear;
  sizeInput.oninput=(e)=>{size=+e.target.value;ctx.lineWidth=size;};
  modeBtns.forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  eraserBtn.onclick=()=>setMode('erase');
  dotBtns.forEach(d=>d.onclick=()=>setColor(d.dataset.color));
  colorInput.oninput=(e)=>setColor(e.target.value);
  document.addEventListener('mousedown',start);
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',end);
  window.addEventListener('resize',resize);
  document.addEventListener('scroll',drawAll,{passive:true,capture:true});
  document.addEventListener('keydown',(e)=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&active){strokes.pop();save();drawAll();e.preventDefault();}});
  resize();load();
})();
  </script>

  <script>
    const src = document.getElementById('bmsrc').textContent;
    const url = 'javascript:' + encodeURIComponent(src);
    document.getElementById('bm').href = url;
    document.getElementById('code').value = url;
  </script>
</body>
</html>
